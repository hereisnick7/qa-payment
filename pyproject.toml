[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-payment"
version = "0.1.0"
description = "Payment-method integration QA — qa-payment-agent + /qa-payment skill for Claude Code"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
  "requests>=2.31",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "urllib3>=2.0",
  "cryptography>=41",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "requests-mock>=1.11"]

[project.scripts]
workflow = "cli.agent:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*", "modules*", "shared*"]
exclude = ["tasks*", "config*", ".claude*"]

[tool.pytest.ini_options]
testpaths = ["modules", ".claude/skills/qa-payment/assets/tests"]
